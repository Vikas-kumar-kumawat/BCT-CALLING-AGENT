services:
  - type: web
    name: bct-calling-agent
    env: node
    plan: free
    buildCommand: python3 -m pip install -r Backend/requirements.txt || true && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SIP_SERVER_IP
        sync: false
      - key: SIP_USERNAME
        sync: false
      - key: SIP_PASSWORD
        sync: false
      - key: SIP_PORT
        value: "5060"
