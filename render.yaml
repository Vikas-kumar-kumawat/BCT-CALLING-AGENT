services:
  - type: web
    name: bct-calling-agent
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
